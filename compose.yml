services:
  # The Flask Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mashup_matcher_backend
    container_name: mashup_backend
    ports:
      - "5000:5000"
    environment: &backend_env
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=${SEARXNG_URL}
      - EMAIL=${EMAIL}
    depends_on:
      - mongodb
      - redis

  # Same image as `backend` (built once, tagged above, and reused here - no
  # separate build section needed), but runs background jobs (SearXNG
  # enrichment, cache recompute) instead of serving HTTP. See backend/jobs.py.
  worker:
    image: mashup_matcher_backend
    container_name: mashup_worker
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "mashup_matcher"]
    environment: *backend_env
    depends_on:
      - mongodb
      - redis

  # The Webapp frontend
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

  # The Local MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: mashup_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./data/mongo:/data/db

  # Backing queue for the RQ background jobs `backend` enqueues and `worker` runs.
  # --appendonly so queued/result data survives a restart, not just periodic RDB snapshots.
  redis:
    image: redis:7-alpine
    container_name: mashup_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
