services:
  # The Flask Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mashup_matcher_backend
    container_name: mashup_backend
    ports:
      - "5000:5000"
    environment: &backend_env
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=mongodb:27017
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=${SEARXNG_URL}
      - EMAIL=${EMAIL}
      - FRONTEND_ORIGIN=http://localhost:5173
      # SearXNG search pacing (see core/services/search_throttle.py) - override in .env
      - SEARCH_MIN_DELAY=${SEARCH_MIN_DELAY:-2}
      - SEARCH_MAX_DELAY=${SEARCH_MAX_DELAY:-5}
      - SEARCH_BACKOFF_BASE=${SEARCH_BACKOFF_BASE:-60}
      - SEARCH_BACKOFF_MAX=${SEARCH_BACKOFF_MAX:-900}
      - SEARCH_MAX_CONSECUTIVE_BLOCKS=${SEARCH_MAX_CONSECUTIVE_BLOCKS:-3}
    depends_on:
      - mongodb
      - redis

  # Same image as `backend` (built once, tagged above, and reused here - no
  # separate build section needed), but runs background jobs (SearXNG
  # enrichment, cache recompute) instead of serving HTTP. See backend/jobs.py.
  worker:
    image: mashup_matcher_backend
    container_name: mashup_worker
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "mashup_matcher"]
    environment: *backend_env
    depends_on:
      - mongodb
      - redis

  # The Webapp frontend (dev server w/ HMR - see frontend/Dockerfile)
  frontend:
    build:
      context: ./frontend
    container_name: mashup_frontend
    ports:
      - "5173:5173"
    environment:
      # The browser calls this directly, so it must be host-reachable - not
      # the internal Docker service name.
      - VITE_API_URL=http://localhost:5000
      # Bind-mount file events don't reach the container on Docker Desktop (Windows) - poll instead
      - VITE_USE_POLLING=true
    # Bind-mount the source for HMR, but keep the container's own (Linux)
    # node_modules via an anonymous volume, so it isn't shadowed by the bind
    # mount's host (Windows) node_modules - Vite/esbuild ship native binaries.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # The Local MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: mashup_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./data/mongo:/data/db

  # Backing queue for the RQ background jobs `backend` enqueues and `worker` runs.
  # --appendonly so queued/result data survives a restart, not just periodic RDB snapshots.
  redis:
    image: redis:7-alpine
    container_name: mashup_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
